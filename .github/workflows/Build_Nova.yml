name: 🔥NovaKernel Kernel Build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Target device"
        required: true
        type: choice
        options:
          - all
          - a73xq
          - a52sxq
          - m52xq

      kernelsu:
        description: "Enable KernelSU?"
        required: true
        type: boolean
        default: false

      ksu_repo:
        description: "KernelSU repo URL (optional)"
        required: false
        default: ""

      ksu_branch:
        description: "KernelSU branch"
        required: false
        type: choice
        default: "legacy-susfs-v2"
        options:
          - legacy
          - main
          - next
          - susfs-main
          - susfs-next
          - legacy-susfs-v2
          - custom

      ksu_branch_custom:
        description: "Custom branch name (only if ksu_branch = custom)"
        required: false
        default: ""

      hook_type:
        description: "KernelSU hook type (ignored if kernelsu = false)"
        required: false
        type: choice
        default: "kprobes"
        options:
          - kprobes
          - scope-min-1.6
          - rksu
          - syscall
          - inline

      backport:
        description: "Apply backport patches? (ignored if kernelsu = false)"
        required: false
        type: boolean
        default: false

      debug:
        description: "SELinux permissive (debug build)"
        required: false
        type: boolean
        default: false

      upload_to_telegram:
        description: "Upload build to Telegram?"
        required: true
        type: boolean
        default: true

      release_type:
        description: "Release type"
        required: true
        type: choice
        default: "beta"
        options:
          - stable
          - beta

      changelog:
        description: "Build changelog / notes"
        required: false
        default: "No changelog provided"

concurrency:
  group: nova-build-${{ github.event.inputs.variant }}-${{ github.run_number }}
  cancel-in-progress: true

jobs:

# ───────── Setup Matrix ─────────
  setup:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: 🗂️  Prepare build matrix
        id: set-matrix
        run: |
          case "${{ github.event.inputs.variant }}" in
            all)    echo 'matrix=["a73xq","a52sxq","m52xq"]' >> "$GITHUB_OUTPUT" ;;
            a73xq)  echo 'matrix=["a73xq"]'                  >> "$GITHUB_OUTPUT" ;;
            a52sxq) echo 'matrix=["a52sxq"]'                 >> "$GITHUB_OUTPUT" ;;
            m52xq)  echo 'matrix=["m52xq"]'                  >> "$GITHUB_OUTPUT" ;;
          esac

# ───────── Build Job ─────────
  build:
    needs: setup
    runs-on: ubuntu-24.04
    name: "🔨 Build (${{ matrix.device }})"

    strategy:
      matrix:
        device: ${{ fromJSON(needs.setup.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: 📥  Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 📦  Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git curl wget unzip tar lz4 zip patch \
            bc bison flex libssl-dev libelf-dev \
            python3 cpio rsync \
            make gcc g++ binutils

      - name: 💾  Setup swap (10 GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: 🔎  Detect clang version
        id: clangver
        shell: bash
        run: |
          CLANGVER=$(grep -oP 'CLANGVER="\K[^"]+' buildscript.sh)
          echo "version=$CLANGVER" >> "$GITHUB_OUTPUT"

      - name: 📂  Clang cache
        id: clang-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchains/${{ steps.clangver.outputs.version }}
          key: clang-${{ runner.os }}-${{ steps.clangver.outputs.version }}

      - name: ⚡  KernelSU Setup
        if: github.event.inputs.kernelsu == 'true'
        timeout-minutes: 15
        env:
          NK_VARIANT:        ${{ matrix.device }}
          NK_KSU:            ${{ github.event.inputs.kernelsu }}
          NK_KSU_REPO:       ${{ github.event.inputs.ksu_repo }}
          NK_KSU_BRANCH:     ${{ github.event.inputs.ksu_branch == 'custom' && github.event.inputs.ksu_branch_custom || github.event.inputs.ksu_branch }}
          NK_HOOK_TYPE:      ${{ github.event.inputs.hook_type }}
          NK_BACKPORT:       ${{ github.event.inputs.backport }}
        run: |
          chmod +x buildscript.sh
          ./buildscript.sh --phase ksu

      - name: 🔨  Build kernel
        timeout-minutes: 60
        env:
          NK_VARIANT:        ${{ matrix.device }}
          NK_KSU:            ${{ github.event.inputs.kernelsu }}
          NK_KSU_BRANCH:     ${{ github.event.inputs.ksu_branch == 'custom' && github.event.inputs.ksu_branch_custom || github.event.inputs.ksu_branch }}
          NK_HOOK_TYPE:      ${{ github.event.inputs.hook_type }}
          NK_BACKPORT:       ${{ github.event.inputs.backport }}
          DEBUG:             ${{ github.event.inputs.debug }}
        run: |
          ./buildscript.sh --phase build

      - name: 🔍  Locate output ZIP
        id: find-zip
        run: |
          case "${{ matrix.device }}" in
            a73xq)  DEVICE_DIR="A73"  ;;
            a52sxq) DEVICE_DIR="A52S" ;;
            m52xq)  DEVICE_DIR="M52"  ;;
          esac
          ZIP=$(find "$HOME/toolchains/NovaKernel/$DEVICE_DIR" -name "*.zip" | head -n1)
          echo "zip_path=$ZIP"      >> "$GITHUB_OUTPUT"
          echo "zip_name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: ⬆️   Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-zip.outputs.zip_name }}
          path: ${{ steps.find-zip.outputs.zip_path }}
          compression-level: 0

      - name: 📤  Upload to Telegram
        if: success() && github.event.inputs.upload_to_telegram == 'true'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          CHANGELOG:    ${{ github.event.inputs.changelog }}
        run: |
          ZIP="${{ steps.find-zip.outputs.zip_path }}"
          ZIP_NAME="${{ steps.find-zip.outputs.zip_name }}"
          DEVICE="${{ matrix.device }}"
          TYPE="${{ github.event.inputs.kernelsu == 'true' && 'KSU' || 'GKI' }}"
          HOOK="${{ github.event.inputs.hook_type }}"
          BACKPORT="${{ github.event.inputs.backport }}"
          RELEASE="${{ github.event.inputs.release_type }}"
          RELEASE_LABEL=$([[ "$RELEASE" == "stable" ]] && echo "✅ Stable" || echo "🧪 Beta")
          TIME=$(date +"%Y-%m-%d %H:%M")
          SHORT_SHA="${GITHUB_SHA:0:7}"

          # تجهيز الرسالة بتنسيق HTML
          CAPTION=$(printf "<b>🚀 NovaKernel — Build Ready!</b>\n\n")
          CAPTION="${CAPTION}<b>📱 Device:</b>  <code>$DEVICE</code>\n"
          CAPTION="${CAPTION}<b>⚙️ Type:</b>    <code>$TYPE</code>\n"
          CAPTION="${CAPTION}<b>🪝 Hook:</b>    <code>$HOOK</code>\n"
          CAPTION="${CAPTION}<b>⬆️ Backport:</b> <code>$BACKPORT</code>\n"
          CAPTION="${CAPTION}<b>🏷️ Release:</b>  $RELEASE_LABEL\n"
          CAPTION="${CAPTION}<b>🔖 Commit:</b>   <a href=\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\">$SHORT_SHA</a>\n"
          CAPTION="${CAPTION}<b>🕒 Time:</b>     <i>$TIME</i>\n\n"
          CAPTION="${CAPTION}<b>📝 Changelog:</b>\n<blockquote>$CHANGELOG</blockquote>\n\n"
          CAPTION="${CAPTION}🛠 <i>Built with Passion</i>"

          curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
            -F chat_id="$TG_CHAT_ID" \
            -F document=@"$ZIP;filename=$ZIP_NAME" \
            -F caption="$CAPTION" \
            -F parse_mode=HTML

      - name: 📋  Write job summary
        if: always()
        run: |
          ZIP="${{ steps.find-zip.outputs.zip_name }}"
          DEVICE="${{ matrix.device }}"
          TYPE="${{ github.event.inputs.kernelsu == 'true' && 'KSU' || 'GKI' }}"
          HOOK="${{ github.event.inputs.hook_type }}"
          BACKPORT="${{ github.event.inputs.backport }}"
          RELEASE="${{ github.event.inputs.release_type }}"
          RELEASE_LABEL=$([[ "$RELEASE" == "stable" ]] && echo "✅ Stable" || echo "🧪 Beta")
          CHANGELOG="${{ github.event.inputs.changelog }}"

          {
            echo "## 🚀 NovaKernel — \`$DEVICE\` [\`$TYPE\`]"
            echo ""
            echo "> ### 📝 Changelog"
            echo "> $CHANGELOG"
            echo ""
            echo "| Field | Value |"
            echo "|:------|:------|"
            echo "| 📱 Device    | \`$DEVICE\` |"
            echo "| 🏷️ Type      | \`$TYPE\` |"
            echo "| 🪝 Hook      | \`$HOOK\` |"
            echo "| ⬆️ Backport  | \`$BACKPORT\` |"
            echo "| 🏷️ Release   | $RELEASE_LABEL |"
            echo "| 📦 Output    | \`$ZIP\` |"
          } >> "$GITHUB_STEP_SUMMARY"
